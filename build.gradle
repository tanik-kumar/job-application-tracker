plugins {
    id 'war'
    id 'org.gretty' version '3.1.9'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.apache.struts:struts2-core:2.5.33'
    providedCompile 'javax.servlet:javax.servlet-api:4.0.1'
    providedCompile 'javax.servlet.jsp:javax.servlet.jsp-api:2.3.3'
    implementation 'javax.servlet.jsp.jstl:javax.servlet.jsp.jstl-api:1.2.1'
    implementation 'org.glassfish.web:javax.servlet.jsp.jstl:1.2.5'

    // Log4j2 as the SLF4J backend - provides real INFO/DEBUG console logging
    // and removes the "could not find a logging implementation" warning.
    implementation 'org.apache.logging.log4j:log4j-core:2.20.0'
    implementation 'org.apache.logging.log4j:log4j-slf4j-impl:2.20.0'
}

gretty {
    servletContainer = 'jetty9.4'
    contextPath = '/'
    httpPort = 8080
}

sourceCompatibility = JavaVersion.VERSION_11
targetCompatibility = JavaVersion.VERSION_11
